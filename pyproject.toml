[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-bank"
version = "0.2.0"
description = "让你的 AI 助手越用越懂你 — 职场记忆 MCP Server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "agent-bank contributors" },
]
keywords = ["mcp", "memory", "ai", "agent", "workplace", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
agent-bank = "agent_bank.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
